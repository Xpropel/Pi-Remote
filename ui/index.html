<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link id="app-favicon" rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" sizes="any" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- 浅 / 深两种都支持；实际用哪种由下面的首帧脚本按偏好写到 <html style="color-scheme"> -->
    <meta name="color-scheme" content="light dark" />
    <!--
      状态栏 / 加到主屏幕时的颜色：浅色 = --cw-bg（tokens.css），深色 = --cw-bg（pi-theme.css 深色，design §6.5）。
      跟随系统时照 media；选了固定主题时首帧脚本（之后是 usePiTheme）只让和主题一致的那一份生效（design §4.3"状态栏颜色跟主题走"）。
    -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F7F7" data-pi-theme-color="light" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161617" data-pi-theme-color="dark" />
    <title>pi</title>
    <script>
      /*
       * 首帧主题（P6.4；P7 B1 起 index.html 就是新界面的入口，原 next.html 已删）：同步执行、先于样式与 React，避免浅 / 深色闪烁。
       * 只写 <html data-pi-theme> / style.colorScheme（再加上面两个 theme-color 的 media），不写 data-theme，不加 style-nova。
       * 偏好 = localStorage["pi_remote_pi_prefs"].theme（"system" / "light" / "dark"；usePiUiState 存，设置页和显示选项改的就是它）。
       * 新键里没有合法 theme 时取旧界面的 localStorage["pi-remote.theme"]（只有 light / dark），否则跟随系统——
       * 和 ui/src/pi/model/prefs.ts 的 piThemePrefOf 同一条规则（test/pi-p6-a.test.mjs 两边逐条比）。旧键只读，不再写。
       * 跟随系统时听 matchMedia；别的标签页改了偏好（storage 事件）跟着变。React 起来以后由 pi/hooks/usePiTheme 接手。
       * 偏好里旧的 ui 字段（claude / codex）不读：界面只有一套，旧值不影响首帧。
       */
      (function () {
        var KEY = "pi_remote_pi_prefs";
        var LEGACY = "pi-remote.theme";
        var root = document.documentElement;
        var media = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;

        function read(key) {
          try {
            return window.localStorage.getItem(key);
          } catch (error) {
            return null;
          }
        }

        /** 新键内容（JSON 字符串可多层）→ 对象；解析不了 = null */
        function storedPrefs() {
          try {
            var value = read(KEY);
            while (typeof value === "string") value = JSON.parse(value);
            return value && typeof value === "object" && !Array.isArray(value) ? value : null;
          } catch (error) {
            return null;
          }
        }

        function storedTheme() {
          var prefs = storedPrefs();
          var theme = prefs ? prefs.theme : null;
          return theme === "system" || theme === "light" || theme === "dark" ? theme : null;
        }

        function pref() {
          var theme = storedTheme();
          if (theme) return theme;
          var legacy = read(LEGACY);
          return legacy === "light" || legacy === "dark" ? legacy : "system";
        }

        function apply() {
          var p = pref();
          var theme = p === "system" ? (media && media.matches ? "dark" : "light") : p;
          root.setAttribute("data-pi-theme", theme);
          root.style.colorScheme = theme;
          var metas = document.querySelectorAll('meta[name="theme-color"][data-pi-theme-color]');
          for (var i = 0; i < metas.length; i++) {
            var own = metas[i].getAttribute("data-pi-theme-color");
            metas[i].setAttribute("media", p === "system" ? "(prefers-color-scheme: " + own + ")" : own === theme ? "all" : "not all");
          }
        }

        apply();

        if (media) {
          var onSystemChange = function () {
            if (pref() === "system") apply();
          };
          if (typeof media.addEventListener === "function") media.addEventListener("change", onSystemChange);
          else if (typeof media.addListener === "function") media.addListener(onSystemChange);
        }

        window.addEventListener("storage", function (event) {
          if (event.key === KEY || event.key === LEGACY || event.key === null) apply();
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/pi/main.tsx"></script>
  </body>
</html>
